; Конфигурация PlatformIO для ESP32-S3-DevKitC-1
; Сборка:  pio run
; Запуск симуляции:  F1 -> "Wokwi: Start Simulator"

; Обычный `pio run` собирает только прошивку для платы: окружение native —
; это хост-тесты чистой логики (make test), и собирать их вместе с прошивкой
; нельзя, там нет Arduino.h.
[platformio]
default_envs = esp32-s3-devkitc-1

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

; Чистая логика проверяется на хосте: make test.
; Исходники src/ здесь не собираются — они для платы (там Arduino.h), а модули
; чистые и подключаются тестом напрямую. Поэтому у окружения нет ни платы,
; ни токена Wokwi: это единственная проверка поведения, доступная локально.
[env:native]
platform = native
test_build_src = no
