# Конфигурация для Wokwi for VS Code / Wokwi CLI.
# Пути указывают на результат сборки PlatformIO (pio run).
# На wokwi.com этот файл не нужен — там компиляция идёт в облаке.

[wokwi]
version = 1
firmware = '.pio/build/esp32-s3-devkitc-1/firmware.bin'
elf = '.pio/build/esp32-s3-devkitc-1/firmware.elf'