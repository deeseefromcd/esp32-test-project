schema: spec-driven

# context — обязательный ввод для агента: вставляется в инструкции каждого артефакта,
# а также в apply и archive. Это то, что агент не может вывести из кода.
context: |
  Language: ru
  All artifacts must be written in ru.
  Keep OpenSpec structural headings and SHALL/MUST keywords in English.

  Проект: прошивка для ESP32-S3 (PlatformIO, framework Arduino) под симулятор Wokwi.
  Стенд герконовой сетки 4x4: шестнадцать клеток читаются через два 74HC165 в цепочке,
  светодиод на GPIO48 мигает с периодом 1000 мс. Контракт serial: строка запуска
  "ESP32-S3 reed grid started (GPIO48, 4x4)", "LED ON" / "LED OFF",
  событие на каждое изменение клетки "cell A1 closed" / "cell A1 opened",
  строка "grid: 3 closed" (сколько клеток занято) и поле сеткой с шапкой A B C D.

  Команды этого проекта (используй именно их):
    make setup        — поставить brew-зависимости (Brewfile); make doctor — проверить окружение
    make lint         — cppcheck + схема + config.yaml + workflow + актуальность производных файлов (быстро, без сборки)
    make check        — то же + компиляция sketch.ino + native-тесты + сборка прошивки (автоматически находит pio: venv или из PATH)
    make build        — только сборка прошивки
    make test         — native-тесты чистой логики (pio test -e native, на хосте, без платы и токена)
    make sketch       — пересобрать sketch.ino из src/
    make diagram      — пересобрать diagram.json из описания схемы (tools/diagram/)
    make diagram-capture — снять посадку и разводку из diagram.json в layout.json
    make sim         — прогон сценария в симуляторе Wokwi локально; нужен WOKWI_CLI_TOKEN в окружении, serial остаётся в serial.log
    сценарий blink.test.yaml — проверка сетки и мигания в симуляции (serial + уровень на пине led1:A): локально через make sim, иначе в CI

  Ограничения процесса:
    - Перед работой прочитай AGENTS.md, а для планирования — docs/SDD-WORKFLOW.md
    - sketch.ino и diagram.json — производные файлы: правь src/ и tools/diagram/, затем make sketch или make diagram. Расхождение ловит make lint
    - Изменение src/ или diagram.json требует обновления проекта на wokwi.com (AGENTS.md, раздел 2)
    - WOKWI_CLI_TOKEN — секрет; не запрашивать, не логировать, не коммитить
    - Все список-строки в этом файле заключай в кавычки, если они содержат двоеточие

  Тестируемость кода (учитывай при планировании и реализации):
    - Чистая логика вынесена в src/ модулями без Arduino.h (grid_logic.h — адресация клеток,
      карта бит, антидребезг, отрисовка; blink.h — отсчёт мигания) и проверяется
      native-тестами: make test → pio test -e native, на хосте, без платы и токена.
    - НЕ добавляй юнит-тесты для среды esp32-s3-devkitc-1 с моками Arduino:
      pio test локально падает на "[upload] Error 2" (нужна плата), то есть цель
      невыполнима — та же ошибка, что невыполнимый локально blink.test.yaml.
    - Новую чистую логику (разбор состояния, автомат состояний, антидребезг) выноси в src/
      отдельным модулем без Arduino.h: на входе и выходе числа или структуры. Всё, что
      трогает железо (digitalWrite, delay, Serial), живёт в модулях с Arduino.h
      (grid_reader.h, main.cpp) и юнит-тестами не покрывается.
    - Проверка поведения прошивки в симуляции — это blink.test.yaml (локально make sim с токеном, иначе Wokwi CI), а не юнит-тесты.

  Зависимости окружения (это правило, а не справка):
    - Инструмент, нужный на машине (для сборки, lint, тестов), обязан быть
      ЗАРЕГИСТРИРОВАН в репозитории. Просто поставить его локально недостаточно:
      коллега восстановит окружение только из зарегистрированного списка.
    - Порядок регистрации нового инструмента (всего два места):
      1) brew-пакет: добавь строку brew "<имя>" в Brewfile — make setup его поставит,
         а make doctor сам прочитает Brewfile и о нём сообщит, ничего дописывать не надо;
      2) не-brew инструмент (pio, wokwi-cli, node, openspec): добавь вызов require
         в scripts/doctor.sh — имя, команда версии, команда установки.
    - Инструмент, нужный ТОЛЬКО для проверки в CI, регистрируй в workflow,
      а не в Brewfile и не в doctor (на машине он не нужен).
    - Если инструмент появился в новой цели make — обнови make help и таблицу
      проверок в AGENTS.md и docs/SDD-WORKFLOW.md, иначе он «не существует».

# rules — дополнительные правила для конкретного артефакта.
# ВНИМАНИЕ: если строка содержит ": ", её ОБЯЗАТЕЛЬНО брать в кавычки,
# иначе YAML прочитает её как mapping, и OpenSpec молча отбросит ВСЕ правила артефакта.
rules:
  specs:
    - "Спека описывает наблюдаемое поведение, а не реализацию: не указывай имена функций, файлов сборки и координаты деталей на схеме."
    - "Каждое требование короткое (одно поведение); примеры и крайние случаи — в сценариях."
  tasks:
    - "Каждая задача содержит способ проверки прямо в тексте (команда, тест или наблюдаемое поведение)."
    - "Задачи, меняющие прошивку или схему, включают проверки сборки и симуляции, а не только правку файла."
    - "Синхронизацию с wokwi.com выноси в отдельную задачу последней группы."
    - "Задача, добавляющая чистую логику, включает вынос её в src/ отдельно от Arduino.h и юнит-тест на [env:native]; задача без логики юнит-тестов не требует."
    - "Задача, вводящая новый инструмент на машину, включает его регистрацию в репозитории: Brewfile (для brew) или require в scripts/doctor.sh (для остальных). README-таблицы для этого нет."
  design:
    - "Если выбираешь между вариантами (пин, тип serial, плата) — фиксируй отвергнутые альтернативы и причину отказа."

# operations — как проводить apply и archive. Только эти два ключа читаются.
# Те же правила про кавычки: строка с ": " должна быть в кавычках.
operations:
  apply:
    guidance:
      - "Сначала прочитай AGENTS.md и docs/SDD-WORKFLOW.md."
      - "Выполняй задачи по порядку и отмечай - [x] только после успешной проверки этой задачи."
      - "Быстрая локальная проверка после правок: make check (cppcheck + схема + config.yaml + workflow + компиляция sketch.ino + native-тесты + сборка)."
      - "Правка только документации или OpenSpec-артефактов: make check избыточен, достаточно make lint."
      - "Перед отчётом о готовности: npx @fission-ai/openspec@latest validate <change> --strict должен проходить."
      - "Поведение (blink.test.yaml) проверяется прогоном сценария: локально — make sim, если WOKWI_CLI_TOKEN есть в окружении, иначе Wokwi CI по push или симуляция в браузере. Токен не запрашивай и не печатай."
      - "Если правка затронула src/main.cpp или diagram.json: синхронизируй sketch.ino и обнови проект на wokwi.com (AGENTS.md, раздел 2)."
      - "Поставил новый инструмент или ввёл новую цель make — зарегистрируй его в репозитории: brew-пакет строкой в Brewfile (make doctor подхватит его сам), не-brew — через require в scripts/doctor.sh. Незарегистрированный инструмент на чужой машине не появится."
      - "Проверка поведения прошивки — это blink.test.yaml (локально make sim или Wokwi CI), а не юнит-тесты. Юнит-тест добавляй ТОЛЬКО если появилась чистая логика, вынесенная в src/ без Arduino.h, и тогда он идёт на [env:native]; для кода из одних побочных эффектов тест не пишем."
      - "Если проверка не проходит — не отмечай задачу выполненной и не сужай требование; сообщи о блокере."
  archive:
    guidance:
      - "Перед архивацией покажи сводку: какие требования добавляются, какие меняются, что осталось незакрытым."
      - "Если правка затронула src/main.cpp или diagram.json, проверь, что проект на wokwi.com синхронизирован."
